[package]
name = "droidloom-supervisor"
description = "Fail-closed Android cell lifecycle transaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-io = "2.6.0"
futures-lite = "2.6.1"
zbus = { version = "5.18.0", default-features = false, features = ["async-io"] }
droidloom-cpu-placement = { path = "../droidloom-cpu-placement" }
clap.workspace = true
droidloom-contracts = { path = "../droidloom-contracts" }
droidloom-window-policy = { path = "../droidloom-window-policy" }
droidloom-task-control = { path = "../../graphics/droidloom-task-control" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
