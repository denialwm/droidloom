name: Ship pacman repository

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publication at a time; never cancel an expensive build on a newer push.
concurrency:
  group: droidloom-shipping
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ship:
    if: github.repository == 'denialwm/droidloom' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, droidloom-builder]
    timeout-minutes: 1380
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Keep temporary files on the worker disk
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build x86_64 packages using persistent local caches
        run: cargo run --locked -j 1 -p droidloom-package -- build
      - name: Cross-build aarch64 packages
        run: cargo run --locked -j 1 -p droidloom-package -- build --architecture aarch64 --sysroot "$DROIDLOOM_ARM64_SYSROOT"
      - name: Check package installation and lifecycle
        run: |
          version=$(jq -r '.version + "-" + (.release | tostring)' packaging/arch/version.json)
          cargo run --locked -j 1 -p droidloom-package -- check --packages "dist/arch/$version/x86_64"
          cargo run --locked -j 1 -p droidloom-package -- check --packages "dist/arch/$version/aarch64"
      - name: Prepare pacman database and installer
        run: cargo run --locked -j 1 -p droidloom-package -- ship prepare
      - name: Upload packages and matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked -j 1 -p droidloom-package -- ship publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Stop any remaining build containers
        if: always()
        run: cargo run --locked -j 1 -p droidloom-package -- runner cleanup
