[package]
name = "droidloom-wayland"
description = "Wayland multi-window presenter for Droidloom Android tasks"
version.workspace = true
edition.workspace = true
rust-version = "1.87"
license.workspace = true
repository.workspace = true

[dependencies]
droidloom-timing = { path = "../../runtime/droidloom-timing" }
droidloom-contracts = { path = "../../runtime/droidloom-contracts" }
droidloom-cpu-placement = { path = "../../runtime/droidloom-cpu-placement" }
droidloom-surface-bridge = { path = "../droidloom-surface-bridge" }
drm-fourcc.workspace = true
droidloom-denial-endpoint = { path = "../droidloom-denial-endpoint" }
droidloom-denial-ipc = { path = "../droidloom-denial-ipc" }
droidloom-denial-protocol = { path = "../droidloom-denial-protocol" }
droidloom-input-protocol = { path = "../droidloom-input-protocol" }
droidloom-syncobj = { path = "../droidloom-syncobj" }
droidloom-window-policy = { path = "../../runtime/droidloom-window-policy" }
gbm.workspace = true
hex.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smithay-client-toolkit = { workspace = true, features = ["xkbcommon"] }
thiserror.workspace = true
wayland-client.workspace = true
wayland-scanner = "0.31.10"
wayland-protocols.workspace = true
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
tempfile.workspace = true
url = "2.5.8"
zbus = { version = "5.18.0", default-features = false, features = ["async-io"] }
async-io = "2.6.0"
futures-lite = "2.6.1"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dev-dependencies]
async-channel = "2.5.0"
wayland-server = "0.31.13"
wayland-protocols = { workspace = true, features = ["server"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
